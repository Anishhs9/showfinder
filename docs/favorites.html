<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites - ShowFinder</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .favorites-header {
      padding: 4rem 0 2rem;
      text-align: center;
    }
    
    .empty-state {
      text-align: center;
      padding: 6rem 4%;
      max-width: 600px;
      margin: 0 auto;
    }
    
    .empty-state h2 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    
    .empty-state p {
      font-size: 1.25rem;
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
    }
  </style>
</head>
<body>
  
  <main class="page-content">
    <div class="favorites-header">
      <h1>Your Favorites</h1>
    </div>

    <div class="container">
      <div id="favorites-grid" class="grid-container"></div>
      
      <div id="empty-state" class="empty-state hidden">
        <h2>No favorites yet</h2>
        <p>Shows you save will appear here. Build your collection of premium content.</p>
        <a href="browse.html" class="btn btn-primary">Explore Shows</a>
      </div>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/favorites.js"></script>
</body>
</html>
