<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShowFinder - Premium TV Discovery</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* Home specific styles */
    .hero {
      position: relative;
      height: 85vh;
      min-height: 600px;
      display: flex;
      align-items: flex-end;
      padding-bottom: 5rem;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: -1;
    }
    
    .hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }

    .hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg-primary) 0%, rgba(0,0,0,0.7) 40%, rgba(0,0,0,0.1) 100%);
    }

    .hero-content {
      max-width: 800px;
      z-index: 10;
      animation: fadeUp 1s ease;
    }

    .hero-title {
      font-size: 4rem;
      line-height: 1.1;
      margin-bottom: 1rem;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      color: var(--text-secondary);
    }

    .hero-meta span {
      display: flex;
      align-items: center;
    }

    .hero-desc {
      font-size: 1.2rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.6;
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .hero {
        height: 70vh;
        min-height: 500px;
      }
      .hero-title { font-size: 2.5rem; }
      .hero-desc { font-size: 1rem; }
    }
  </style>
</head>
<body>
  
  <div id="hero-container">
    <div class="hero skeleton-hero"></div>
  </div>

  <main class="page-content" style="padding-top: 0; margin-top: -3rem; position: relative; z-index: 10;">
    <section class="shelf-section" id="popular-section">
      <h2 class="shelf-title">Popular Shows</h2>
      <div class="shelf" id="popular-shelf"></div>
    </section>

    <section class="shelf-section" id="recent-section" style="display: none;">
      <h2 class="shelf-title">Recently Viewed</h2>
      <div class="shelf" id="recent-shelf"></div>
    </section>

    <section class="shelf-section" id="drama-section">
      <h2 class="shelf-title">Drama</h2>
      <div class="shelf" id="drama-shelf"></div>
    </section>

    <section class="shelf-section" id="comedy-section">
      <h2 class="shelf-title">Comedy</h2>
      <div class="shelf" id="comedy-shelf"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2023 ShowFinder. Powered by TVMaze API.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/home.js"></script>
</body>
</html>
