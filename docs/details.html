<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Details - ShowFinder</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .details-hero {
      position: relative;
      padding-top: var(--nav-height);
      min-height: 80vh;
      display: flex;
      align-items: center;
    }
    
    .details-bg {
      position: absolute;
      inset: 0;
      z-index: -1;
    }
    
    .details-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.3;
      filter: blur(10px);
    }
    
    .details-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, var(--bg-primary) 0%, transparent 20%, var(--bg-primary) 100%);
    }
    
    .details-content {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 4rem;
      padding-top: 4rem;
      padding-bottom: 4rem;
    }
    
    .details-poster {
      flex: 0 0 300px;
    }
    
    .details-poster img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    
    .details-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .details-title {
      font-size: 3.5rem;
      margin-bottom: 0.5rem;
      line-height: 1.1;
    }
    
    .details-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      color: var(--text-secondary);
    }
    
    .details-summary {
      font-size: 1.15rem;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      max-width: 800px;
    }
    
    .details-tags {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    
    .tag {
      padding: 0.25rem 0.75rem;
      background: rgba(255,255,255,0.1);
      border-radius: 50px;
      font-size: 0.85rem;
    }
    
    .extra-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .info-group h4 {
      color: var(--text-tertiary);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }
    
    .episodes-section {
      padding: 4rem 0;
    }
    
    .season-group {
      margin-bottom: 1rem;
      background: var(--bg-secondary);
      border-radius: 12px;
      overflow: hidden;
    }
    
    .season-header {
      padding: 1.5rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.25rem;
      font-weight: 600;
      background: var(--bg-surface);
      transition: background 0.2s;
    }
    
    .season-header:hover {
      background: var(--bg-surface-hover);
    }
    
    .season-episodes {
      display: none;
      padding: 0 1.5rem 1.5rem;
    }
    
    .season-episodes.active {
      display: block;
    }
    
    .episode-row {
      display: flex;
      padding: 1rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      gap: 1.5rem;
      align-items: center;
    }
    
    .episode-row:last-child {
      border-bottom: none;
    }
    
    .episode-num {
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
      width: 60px;
    }
    
    .episode-name {
      flex: 1;
      font-weight: 500;
    }
    
    .episode-meta {
      color: var(--text-secondary);
      font-size: 0.9rem;
      display: flex;
      gap: 1.5rem;
    }
    
    @media (max-width: 900px) {
      .details-content {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 2rem;
      }
      .details-meta {
        justify-content: center;
      }
      .details-tags {
        justify-content: center;
      }
      .extra-info {
        text-align: left;
      }
      .details-poster {
        flex: 0 0 250px;
      }
    }
    
    @media (max-width: 600px) {
      .episode-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
      .episode-num { width: auto; }
      .episode-meta { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>
  
  <div id="details-container">
    <div class="details-hero" style="justify-content:center;">
      <div class="skeleton-text" style="width: 200px;"></div>
    </div>
  </div>

  <main class="page-content" style="padding-top: 0;">
    <section class="container episodes-section" id="episodes-section" style="display: none;">
      <h2>Episodes</h2>
      <div id="episodes-container" style="margin-top: 2rem;"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/details.js"></script>
</body>
</html>
